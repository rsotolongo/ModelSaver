name: Publish NuGet packages

# Triggers:
#   - Push a tag matching v*.*.* (e.g. "git tag v1.0.0 && git push origin v1.0.0")
#   - Manual run from the Actions tab, supplying a version explicitly.
# Publishes ProQualEx.ModelSaver.Core, .AspNetCore, and .Mvc5 together, in lockstep,
# all stamped with the same version. On success, also commits that version back into
# each csproj's <Version> on main, so the checked-in value never goes stale.
#
# Publishes via NuGet.org Trusted Publishing (OIDC) - no long-lived API key secret.
# Requires a Trusted Publishing policy on nuget.org matching this repo + workflow file
# (see https://learn.microsoft.com/nuget/nuget-org/trusted-publishing), and a
# NUGET_USER repository secret set to the nuget.org profile name (not the email).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish (e.g. 1.0.0)'
        required: true

permissions:
  contents: write # the final step commits the released version back to each csproj
  id-token: write # required to request the GitHub OIDC token for NuGet Trusted Publishing

jobs:
  publish:
    # net48 test execution needs a real .NET Framework runtime, not just the SDK's
    # reference assemblies, so this runs on Windows rather than ubuntu-latest.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve package version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:DISPATCH_VERSION
          }
          else {
            $version = $env:REF_NAME -replace '^v', ''
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore ProQualEx.ModelSaver.slnx

      - name: Build
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build ProQualEx.ModelSaver.slnx --configuration Release --no-restore "-p:Version=$env:PACKAGE_VERSION"

      - name: Test
        run: dotnet test ProQualEx.ModelSaver.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format ProQualEx.ModelSaver.slnx --verify-no-changes

      - name: Pack
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/ProQualEx.ModelSaver.Core/ProQualEx.ModelSaver.Core.csproj --configuration Release --no-build --output artifacts "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/ProQualEx.ModelSaver.AspNetCore/ProQualEx.ModelSaver.AspNetCore.csproj --configuration Release --no-build --output artifacts "-p:Version=$env:PACKAGE_VERSION"
          dotnet pack src/ProQualEx.ModelSaver.Mvc5/ProQualEx.ModelSaver.Mvc5.csproj --configuration Release --no-build --output artifacts "-p:Version=$env:PACKAGE_VERSION"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg

      - name: NuGet login (exchange OIDC token for a short-lived API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        # dotnet nuget push doesn't reliably expand a "dir/*.nupkg" wildcard on Windows,
        # so enumerate the packed files instead of passing a glob straight to it.
        run: |
          Get-ChildItem -Path artifacts -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Bump <Version> in each csproj to the released version
        if: success()
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        # A tag push checks out a detached commit, and main may have moved since the tag
        # was cut, so re-sync to origin/main's tip rather than committing from that detached
        # HEAD or an out-of-date local branch.
        run: |
          git fetch origin main
          git checkout -B main origin/main

          $files = @(
            'src/ProQualEx.ModelSaver.Core/ProQualEx.ModelSaver.Core.csproj',
            'src/ProQualEx.ModelSaver.AspNetCore/ProQualEx.ModelSaver.AspNetCore.csproj',
            'src/ProQualEx.ModelSaver.Mvc5/ProQualEx.ModelSaver.Mvc5.csproj'
          )

          foreach ($file in $files) {
            (Get-Content $file -Raw) -replace '<Version>[^<]*</Version>', "<Version>$env:PACKAGE_VERSION</Version>" |
              Set-Content $file -NoNewline
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $files

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Version already $env:PACKAGE_VERSION in every csproj; nothing to commit."
          }
          else {
            git commit -m "Bump package Version to $env:PACKAGE_VERSION [skip ci]"
            git push origin main
          }
