name: Test RELEASE_PAT bypass

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivial change, commit, and push with RELEASE_PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .bypass-test
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .bypass-test
          git commit -m "test: RELEASE_PAT bypass probe [skip ci]"
          git push "https://x-access-token:${RELEASE_PAT}@github.com/rsotolongo/ModelSaver.git" HEAD:main
